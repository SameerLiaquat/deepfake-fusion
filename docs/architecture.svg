<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6B7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="800" height="600" fill="#FFFFFF"/>
  <rect x="40" y="20" width="300" height="56" rx="8" fill="#B85042"/>
  <text x="190" y="44" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Face X-Ray patches</text>
  <text x="190" y="62" text-anchor="middle" fill="#FFFFFF" font-size="12">4096 x 18</text>
  <rect x="460" y="20" width="300" height="56" rx="8" fill="#1C7293"/>
  <text x="610" y="44" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">GenD CLS token</text>
  <text x="610" y="62" text-anchor="middle" fill="#FFFFFF" font-size="12">1 x 1024</text>
  <line x1="190" y1="76" x2="190" y2="112" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="76" x2="610" y2="112" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="40" y="112" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#B85042" stroke-width="1.5"/>
  <text x="190" y="136" text-anchor="middle" fill="#1E2761" font-size="15" font-weight="bold">Patch projection</text>
  <text x="190" y="154" text-anchor="middle" fill="#6B7280" font-size="12">Linear 18-&gt;512, L2 norm</text>
  <rect x="460" y="112" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#1C7293" stroke-width="1.5"/>
  <text x="610" y="136" text-anchor="middle" fill="#1E2761" font-size="15" font-weight="bold">Query projection</text>
  <text x="610" y="154" text-anchor="middle" fill="#6B7280" font-size="12">Linear 1024-&gt;512, L2 norm</text>
  <line x1="190" y1="168" x2="330" y2="212" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="610" y1="168" x2="470" y2="212" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="212" width="300" height="60" rx="8" fill="#1E2761"/>
  <text x="400" y="238" text-anchor="middle" fill="#FFFFFF" font-size="16" font-weight="bold">Cross-attention (8 heads)</text>
  <text x="400" y="257" text-anchor="middle" fill="#CADCFC" font-size="12">Query = GenD - Key/Value = Face X-Ray patches</text>
  <line x1="400" y1="272" x2="400" y2="308" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="308" width="300" height="56" rx="8" fill="#FFFFFF" stroke="#1E2761" stroke-width="1.5"/>
  <text x="400" y="332" text-anchor="middle" fill="#1E2761" font-size="15" font-weight="bold">Residual + LayerNorm</text>
  <text x="400" y="350" text-anchor="middle" fill="#6B7280" font-size="12">512-dim fused representation</text>
  <line x1="400" y1="364" x2="400" y2="400" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="400" width="300" height="56" rx="8" fill="#D97706"/>
  <text x="400" y="424" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Classifier</text>
  <text x="400" y="442" text-anchor="middle" fill="#FFFFFF" font-size="12">512-&gt;128-&gt;ReLU-&gt;Dropout-&gt;128-&gt;2</text>
  <line x1="400" y1="456" x2="400" y2="492" stroke="#6B7280" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="250" y="492" width="300" height="50" rx="8" fill="#1E2761"/>
  <text x="400" y="522" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="bold">Real / Fake Prediction</text>
  <text x="400" y="580" text-anchor="middle" fill="#6B7280" font-size="12" font-style="italic">Both backbones frozen throughout -- only ~1.65M fusion-head parameters are trained</text>
</svg>
